
name: Django CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Run Django Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django tests
        env:
          DB_ENGINE: sqlite
          APP_VERSION: ${{ github.sha }}
        run: |
          python manage.py test

  build:
    name: Build and Scan Docker Image
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ap-south-1
      ECR_REPOSITORY: techcake-django-app-v3
      AWS_ACCOUNT_ID: "506456084381"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image with commit SHA
        run: |
          docker build \
            --build-arg APP_VERSION=${GITHUB_SHA} \
            -t ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${GITHUB_SHA} \
            .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          format: json
          output: trivy-report.json
          severity: CRITICAL
          exit-code: '1'
          scanners: vuln

      - name: Upload Trivy scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-report-${{ github.sha }}
          path: trivy-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Configure AWS credentials using OIDC
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::506456084381:role/GitHubActionsECRPushRole
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Docker image to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push \
            ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${GITHUB_SHA}

  deploy:
    name: Deploy with AWS CodeDeploy Blue Green
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ap-south-1
      AWS_ACCOUNT_ID: "506456084381"
      ECR_REPOSITORY: techcake-django-app-v3
      S3_BUCKET: techcake-codedeploy-506456084381
      DEPLOY_SHA: ${{ github.sha }}
      MIGRATION_INSTANCE_ID: i-01d1f8ec11fc38fc4
      CODEDEPLOY_APP: techcake-bluegreen-app
      CODEDEPLOY_GROUP: techcake-bluegreen-dg

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::506456084381:role/GitHubActionsECRPushRole
          aws-region: ap-south-1

      - name: Run database migrations once
        run: |
          set -euo pipefail

          IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${DEPLOY_SHA}"

          REMOTE_SCRIPT=$(printf '%s\n' \
            'set -euo pipefail' \
            "REGION=${AWS_REGION}" \
            "ACCOUNT=${AWS_ACCOUNT_ID}" \
            "IMAGE_URI=${IMAGE_URI}" \
            'aws ecr get-login-password --region "$REGION" | docker login --username AWS --password-stdin "$ACCOUNT.dkr.ecr.$REGION.amazonaws.com"' \
            'docker pull "$IMAGE_URI"' \
            'docker inspect techcake-app --format "{{range .Config.Env}}{{println .}}{{end}}" > /tmp/techcake-migration.env' \
            'trap '\''rm -f /tmp/techcake-migration.env'\'' EXIT' \
            'docker run --rm --network host --env-file /tmp/techcake-migration.env "$IMAGE_URI" python manage.py migrate --noinput' \
            'echo "Database migrations completed successfully."')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$MIGRATION_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$(jq -n --arg cmd "$REMOTE_SCRIPT" '{commands: [$cmd]}')" \
            --comment "Database migrations for ${DEPLOY_SHA}" \
            --query 'Command.CommandId' \
            --output text)

          echo "Migration command ID: $COMMAND_ID"

          for attempt in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$MIGRATION_INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            echo "Migration attempt $attempt: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "Migrations succeeded."
              exit 0
            fi

            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "ERROR: Database migration failed."
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$MIGRATION_INSTANCE_ID"
              exit 1
            fi

            sleep 10
          done

          echo "ERROR: Timed out waiting for migrations."
          exit 1

      - name: Prepare CodeDeploy package
        run: |
          set -euo pipefail

          IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${DEPLOY_SHA}"

          printf '%s\n' "$IMAGE_URI" > image_uri.txt

          chmod +x scripts/*.sh

          zip -r deployment.zip appspec.yml scripts image_uri.txt

          echo "Prepared deployment package for:"
          cat image_uri.txt

      - name: Upload deployment package to S3
        run: |
          aws s3 cp deployment.zip \
            "s3://${S3_BUCKET}/codedeploy/${DEPLOY_SHA}.zip"

      - name: Start CodeDeploy deployment
        run: |
          set -euo pipefail

          DEPLOYMENT_ID=$(aws deploy create-deployment \
            --application-name "$CODEDEPLOY_APP" \
            --deployment-group-name "$CODEDEPLOY_GROUP" \
            --revision "revisionType=S3,s3Location={bucket=${S3_BUCKET},key=codedeploy/${DEPLOY_SHA}.zip,bundleType=zip}" \
            --description "GitHub deployment ${DEPLOY_SHA}" \
            --query deploymentId \
            --output text)

          echo "Deployment ID: $DEPLOYMENT_ID"
          echo "DEPLOYMENT_ID=$DEPLOYMENT_ID" >> "$GITHUB_ENV"

      - name: Wait for deployment result
        run: |
          set -euo pipefail

          echo "Waiting for CodeDeploy deployment: $DEPLOYMENT_ID"

          for attempt in {1..60}; do
            STATUS=$(aws deploy get-deployment \
              --deployment-id "$DEPLOYMENT_ID" \
              --query 'deploymentInfo.status' \
              --output text)

            echo "Attempt $attempt: $STATUS"

            if [ "$STATUS" = "Succeeded" ]; then
              echo "CodeDeploy deployment successful."
              exit 0
            fi

            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Stopped" ]; then
              echo "ERROR: CodeDeploy deployment ended with status: $STATUS"
              aws deploy get-deployment \
                --deployment-id "$DEPLOYMENT_ID"
              exit 1
            fi

            sleep 30
          done

          echo "ERROR: Timed out waiting for CodeDeploy deployment."
          exit 1
